name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the validated image to production
        required: true
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    concurrency:
      group: staging-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.STAGING_DEPLOY_PATH }}

            # Pull latest images
            IMAGE_TAG=${{ github.sha }}
            export IMAGE_TAG
            export REGISTRY=${{ env.REGISTRY }}
            export IMAGE_NAME=${{ env.IMAGE_NAME }}

            docker compose -f docker-compose.staging.yml pull api worker web

            # Run DB migrations before swapping containers
            docker compose -f docker-compose.staging.yml run --rm api \
              sh -c "npx prisma migrate deploy --schema prisma/schema.prisma"

            # Rolling restart
            docker compose -f docker-compose.staging.yml up -d --no-deps api worker web

            echo "Deploy to staging complete — image $IMAGE_TAG"

      - name: Wait for staging to be healthy
        uses: nick-fields/retry@v3
        with:
          timeout_seconds: 120
          max_attempts: 24
          retry_wait_seconds: 5
          command: |
            curl -sf ${{ secrets.STAGING_API_URL }}/monitoring/health

      - name: Staging smoke test
        run: |
          # Health check
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" ${{ secrets.STAGING_API_URL }}/monitoring/health)
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi

          # Readiness check
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" ${{ secrets.STAGING_API_URL }}/monitoring/ready)
          if [ "$STATUS" != "200" ]; then
            echo "Readiness check failed with status $STATUS"
            exit 1
          fi

          echo "Staging smoke tests passed for image ${{ github.sha }}"

      - name: Rollback staging on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ${{ secrets.STAGING_DEPLOY_PATH }}
            echo "Rolling back staging to previous containers..."
            docker compose -f docker-compose.staging.yml up -d --no-deps --no-recreate api worker web || true
            echo "Rollback attempted. Check containers manually."

  deploy-production:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_production }}
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Deploy production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.PRODUCTION_DEPLOY_PATH }}
            export IMAGE_TAG=${{ github.sha }}
            export REGISTRY=${{ env.REGISTRY }}
            export IMAGE_NAME=${{ env.IMAGE_NAME }}

            ./scripts/db-backup.sh
            docker compose -f docker-compose.prod.yml pull api worker web
            docker compose -f docker-compose.prod.yml run --rm api \
              sh -c "npx prisma migrate deploy --schema prisma/schema.prisma"
            docker compose -f docker-compose.prod.yml up -d --no-deps api worker web

      - name: Wait for production health
        uses: nick-fields/retry@v3
        with:
          timeout_seconds: 180
          max_attempts: 36
          retry_wait_seconds: 5
          command: curl -sf ${{ secrets.PRODUCTION_API_URL }}/monitoring/ready
